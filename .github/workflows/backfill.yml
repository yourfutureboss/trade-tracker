name: backfill-prices
on:
  workflow_dispatch:
    inputs:
      start: {description: "YYYY-MM-DD", default: "2026-06-25"}
      end:   {description: "YYYY-MM-DD", default: "2026-07-17"}
permissions:
  contents: read
  issues: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Backfill price_marks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -o pipefail
          python backfill_prices.py 2>&1 | tee bf.log
      - name: Publish failure log as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R ${{ github.repository }} \
            --title "backfill-prices failed $(date -u +%FT%H:%MZ)" \
            --body "$(tail -c 6000 bf.log 2>/dev/null || echo 'no log captured')"
