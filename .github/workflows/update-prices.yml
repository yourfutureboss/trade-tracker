name: Daily prices

on:
  schedule:
    # 22:00 UTC Mon–Fri, after the 4 PM ET close.
    # GitHub schedules are best-effort and can run late.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and upsert prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python update_prices.py 2>&1 | tee up.log

      - name: Check triggers and alert
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python check_triggers.py 2>&1 | tee ct.log

      - name: Publish failure log as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R ${{ github.repository }} \
            --title "Daily prices failed $(date -u +%FT%H:%MZ)" \
            --body "$(tail -c 3000 up.log 2>/dev/null; echo; tail -c 3000 ct.log 2>/dev/null)"
